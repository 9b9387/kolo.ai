services:
  mysql:
    image: mysql:8.4
    container_name: kolo-mysql
    command:
      - --ngram-token-size=2
      # ngram drops any bigram containing a stopword ("an", "as", …), which
      # silently breaks English FULLTEXT matches ("Bananas"). No stopwords.
      - --innodb-ft-enable-stopword=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: kolo_dev
      MYSQL_DATABASE: kolo
      MYSQL_USER: kolo
      MYSQL_PASSWORD: kolo_dev
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pkolo_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
